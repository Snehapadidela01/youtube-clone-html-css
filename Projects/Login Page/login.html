<!DOCTYPE html>
<html lang="en">
<head>
   <meta charset="UTF-8">
   <meta name="viewport" content="width=device-width, initial-scale=1.0">
   <title>Login page</title>
   <style>
      body{
         margin: 0;
         font-family: Arial;
         background-color: #f0f2f5;
}
      .container{
         height: 100vh;
         display: flex;
         justify-content: center;
         align-items: center;
      }
      .login-box{
         background: white;
         padding: 40px;
         width: 350px;
         border-radius: 10px;
         box-shadow: 0 4px 10px rgba(0,0,0,0.1);
         text-align: center;
      }
      h2{
    margin-bottom: 25px;
   }

input{
    width: 100%;
    padding: 12px;
    margin-bottom: 15px;
    border: 1px solid #ccc;
    border-radius: 5px;
    box-sizing: border-box;
}
   button{
    width: 100%;
    padding: 12px;
    background: #1877f2;
    color: white;
    border: none;
    border-radius: 5px;
    cursor: pointer;
}

button:hover{
    opacity: 0.9;
}

p{
    margin-top: 15px;
    font-size: 14px;
}
   </style>
</head>
<body>
<div class="container">
    <div class="login-box">
        <h2>Login</h2>

        <input type="email" placeholder="Email">
        <input type="password" placeholder="Password">

        <button>Login</button>

        <p>Don't have an account? <a href="#">Sign up</a></p>
    </div>
</div>
</body>
</html>
